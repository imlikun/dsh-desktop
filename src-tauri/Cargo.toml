[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness 桌面封装（Tauri 2，自用）— 带独立安装的皮肤系统"
authors = ["likun"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
