<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Desktop - 启动失败</title>
<style>
  :root { --brand: #6c4dff; --text: #1c1c28; --muted: #6b6b80; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", sans-serif;
    background: #f7f7fb; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    height: 100vh; padding: 32px;
  }
  .box { max-width: 460px; text-align: center; }
  .icon {
    width: 64px; height: 64px; border-radius: 18px;
    background: var(--brand); margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 28px; font-weight: 700;
  }
  h1 { font-size: 18px; margin-bottom: 10px; }
  p { font-size: 13px; color: var(--muted); line-height: 1.7; }
  code {
    background: #eeedfe; color: #3c3489; padding: 2px 6px;
    border-radius: 6px; font-size: 12px;
  }
  .steps { text-align: left; margin: 16px 0; font-size: 13px; color: var(--muted); }
  .steps div { padding: 4px 0; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">DSH</div>
    <h1>启动失败</h1>
    <p>未能启动 DeepSeek Harness 服务。</p>
    <div class="steps">
      <div>1. 确认已全局安装 dsh：<code>npm install -g @deepseek-ai/dsh</code></div>
      <div>2. 确认 Node.js ≥ 22.19（建议 v24）</div>
      <div>3. 重启本应用；若仍失败，在终端运行 <code>dsh web</code> 查看报错</div>
    </div>
  </div>
</body>
</html>
